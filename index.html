,","Ya Bapa, di dalam Engkaulah kami hidup, bergerak, dan ada,"]},F0={makan:["yang dengan kemurahan-Mu menumbuhkan hasil bumi dan melimpahkan rezeki bagi kami,","yang memberkati kerja tangan manusia dan menggandakan rezeki dari kelimpahan ciptaan-Mu,","yang dengan penyelenggaraan-Mu menyediakan hidangan dari kelimpahan ciptaan-Mu,","yang tak pernah membiarkan kami kekurangan dan selalu membuka tangan-Mu dengan murah hati,"],pagi:["yang membangunkan kami dari tidur, memperbarui kasih setia-Mu setiap pagi, dan menganugerahkan hari baru untuk mengasihi-Mu,","yang mengusir kegelapan malam dan memanggil kami kepada terang kasih-Mu yang tak berkesudahan,","yang dengan embun pagi menyegarkan jiwa kami dan membangkitkan harapan baru,","yang setia menjaga kami sepanjang malam dan kini membuka hari dengan rahmat-Mu,"],malam:["yang menyertai kami sepanjang hari ini dan kini menaungi kami dengan damai-Mu saat malam tiba,","yang menjadi penjaga kami yang tak pernah terlelap dan naungan di kala gelap,","yang meredakan lelah jiwa kami dan mengundang kami beristirahat dalam pelukan-Mu,","yang menutup hari dengan kasih-Mu dan menjaga tidur kami dalam damai,"],ulang_tahun:["sumber segala kehidupan, yang dengan kasih setia menganugerahkan napas, waktu, dan bertambahnya tahun kepada kami,","yang menenun hidup kami sejak dalam kandungan dan menuntun kami dengan rencana kasih-Mu,","yang dengan murah hati melipatgandakan tahun-tahun kami dan menghiasi dengan berkat-Mu,","yang adalah Alfa dan Omega, awal dan akhir segala usia dan harapan kami,"],kesembuhan:["Allah Tabib Agung yang penuh belas kasih, yang memandang penderitaan kami dan berkuasa menyembuhkan,","yang menjamah yang sakit dengan tangan-Mu yang penuh kuasa dan mengangkat beban penderitaan,","yang tak memandang hina seruan orang yang remuk hatinya dan mendekat kepada yang terluka,","yang dengan bilur-bilur Putra-Mu telah menyembuhkan luka-luka kami,"],keluarga:["Allah Bapa, asal dan teladan setiap keluarga di surga dan di bumi,",  merangkul kami kembali,","yang menanti kepulangan kami seperti Bapa menanti anak yang hilang,","yang dengan darah Putra-Mu telah menghapus hutang dosa kami,","yang dengan lembut membasuh hati kami dan membaharui semangat yang luluh,"]},Jc={makan:{text:"Segala ciptaan Allah itu baik dan tidak ada yang haram, jika diterima dengan ucapan syukur, sebab semuanya itu dikuduskan oleh firman Allah dan doa.",ref:"1 Tim 4:4-5",full:"Segala ciptaan Allah itu baik... dikuduskan oleh firman Allah dan doa. (1 Tim 4:4-5)"},pagi:{text:"Tak berkesudahan kasih setia TUHAN, tak habis-habisnya rahmat-Nya, selalu baru tiap pagi.",ref:"Rat 3:22-23",full:"Tak berkesudahan kasih setia TUHAN, tak habis-habisnya rahmat-Nya, selalu baru tiap pagi. (Rat 3:22-23)"},malam:{text:"Dengan tenteram aku mau membaringkan diri, lalu segera tidur, sebab hanya Engkaulah, ya TUHAN, yang membuat aku diam dengan aman.",ref:"Mzm 4:9",full:"Dengan tenteram aku mau membaringkan diri, lalu segera tidur, sebab hanya Engkaulah, ya TUHAN, yang membuat aku diam dengan aman. (Mzm 4:9)"},ulang_tahun:{text:"Ajarlah kami menghitung hari-hari kami sedemikian, hingga kami beroleh hati yang bijaksana.",ref:"Mzm 90:12",full:"Ajarlah kami menghitung hari-hari kami sedemikian, hingga kami beroleh hati yang bijaksana. (Mzm 90:12)"},kesembuhan:{text:"Sebab Aku akan mendatangkan kesembuhan bagimu, Aku akan mengobati luka-lukamu, demikianlah firman TUHAN.",ref:"Yer 30:17",full:"Sebab Aku akan mendatangkan kesembuhan bagimu, Aku akan mengobati luka-lukamu. (Yer 30:17)"},keluarga:{text:"Tetapi aku dan seisi rumahku, kami akan beribadah kepada TUHAN.",ref:"Yos 24:15",full:"Tetapi aku dan seisi rumahku, kami akan beribadah kepada TUHAN. (Yos 24:15)"},pekerjaan:{text:"Apa pun juga yang kamu perbuat, perbuatlah dengan segenap hatimu seperti untuk Tuhan dan bukan untuk manusia.",ref:"Kol 3:23",full:"Apa pun juga yang kamu perbuat, perbuatlah dengan segenap hatimu seperti untuk Tuhan. (Kol 3:23)"},perjalanan:{text:"TUHAN akan menjaga keluar masukmu, dari sekarang sampai selama-lamanya.",ref:"Mzm 121:8",full:"TUHAN akan menjaga keluar masukmu, dari sekarang sampai selama-lamanya. (Mzm 121:8)"},bimbingan:{text:"Percayalah kepada TUHAN dengan segenap hatimu, dan janganlah bersandar kepada pengertianmu sendiri. Maka Ia akan meluruskan jalanmu.",ref:"Ams 3:5-6",full:"Percayalah kepada TUHAN dengan segenap hatimu... maka Ia akan meluruskan jalanmu. (Ams 3:5-6)"},arwah:{text:"Akulah kebangkitan dan hidup; barangsiapa percaya kepada-Ku, ia akan hidup walaupun ia sudah mati.",ref:"Yoh 11:25",full:"Akulah kebangkitan dan hidup; barangsiapa percaya kepada-Ku, ia akan hidup walaupun ia sudah mati. (Yoh 11:25)"},syukur:{text:"Bersyukurlah kepada TUHAN, sebab Ia baik! Bahwasanya untuk selama-lamanya kasih setia-Nya.",ref:"Mzm 107:1",full:"Bersyukurlah kepada TUHAN, sebab Ia baik! Bahwasanya untuk selama-lamanya kasih setia-Nya. (Mzm 107:1)"},tobat:{text:"Sekalipun dosamu merah seperti kirmizi, akan menjadi putih seperti salju.",ref:"Yes 1:18",full:"Sekalipun dosamu merah seperti kirmizi, akan menjadi putih seperti salju. (Yes 1:18)"}},jc={makan:["sehingga kami dikuatkan untuk berbagi rezeki dengan sesama yang berkekurangan dan senantiasa bersyukur atas kemurahan-Mu","sehingga santapan ini menguatkan tubuh dan jiwa kami untuk semakin setia melayani Dikau dan sesama","sehingga kami semakin peka akan kelaparan sesama dan murah hati membagikan berkat-Mu","sehingga melalui rezeki ini kami memuliakan Dikau dan bertumbuh dalam kasih persaudaraan"],pagi:["sehingga hari ini menjadi persembahan yang hidup bagi kemuliaan-Mu dan kebaikan bagi sesama yang kami jumpai","sehingga setiap langkah hari ini memancarkan kasih-Mu dan membawa damai bagi yang letih","sehingga kami tekun dalam kebaikan dan tak jemu menjadi saksi terang-Mu di dunia","sehingga suka dan duka hari ini kami jalani bersama Dikau dengan hati yang tabah"],malam:["sehingga kami beristirahat dalam damai-Mu, dijauhkan dari mimpi buruk dan bangun dengan semangat

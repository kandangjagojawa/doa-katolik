lah Bapa yang Mahakudus, pencipta dan pemelihara hidup kami,","Bapa yang penuh kerahiman, yang tak pernah meninggalkan kami,"],pribadi:["Bapa terkasih yang selalu hadir dalam hidupku,","Bapa yang kukasihi dan kurindukan,","Yesus, Tuhan dan sahabat setiaku,","Bapa, Engkau yang mengenalku lebih dari diriku sendiri,","Tuhan Yesus yang selalu menyertai langkahku,"],kitab_suci:["Ya Bapa, Engkaulah sumber segala kebaikan dan kasih setia,","Ya Tuhan, Engkaulah terang dan keselamatanku,","Bapa yang berfirman dan segala sesuatu dijadikan,","Allah yang kasih setia-Mu mengatasi langit,","Ya Bapa, di dalam Engkaulah kami hidup, bergerak, dan ada,"]},F0={makan:["yang dengan kemurahan-Mu menumbuhkan hasil bumi dan melimpahkan rezeki bagi kami,","yang memberkati kerja tangan manusia dan menggandakan rezeki dari kelimpahan ciptaan-Mu,","yang dengan penyelenggaraan-Mu menyediakan hidangan dari kelimpahan ciptaan-Mu,","yang tak pernah membiarkan kami kekurangan dan selalu membuka tangan-Mu dengan murah hati,"],pagi:["yang membangunkan kami dari tidur, memperbarui kasih setia-Mu setiap pagi, dan menganugerahkan hari baru untuk mengasihi-Mu,","yang mengusir kegelapan malam dan memanggil kami kepada terang kasih-Mu yang tak berkesudahan,","yang dengan embun pagi menyegarkan jiwa kami dan membangkitkan harapan baru,","yang setia menjaga kami sepanjang malam dan kini membuka hari dengan rahmat-Mu,"],malam:["yang menyertai kami sepanjang hari ini dan kini menaungi kami dengan damai-Mu saat malam tiba,","yang menjadi penjaga kami yang tak pernah terlelap dan naungan di kala gelap,","yang meredakan lelah jiwa kami dan mengundang kami beristirahat dalam pelukan-Mu,","yang menutup hari dengan kasih-Mu dan menjaga tidur kami dalam damai,"],buka_pertemuan:["yang bersabda di mana dua atau tiga berkumpul dalam nama-Mu, di situ Engkau ada di tengah mereka,","yang menghimpun kami sebagai keluarga Allah dan mengundang kami berjalan bersama dalam sinode kasih-Mu,","yang mencurahkan Roh kebijaksanaan agar kami saling mendengarkan dengan rendah hati,","yang mempersatukan kami dalam satu iman, satu harapan, dan satu kasih persaudaraan,"],tutup_pertemuan:["yang telah menyertai kebersamaan kami dan menaburkan benih Sabda-Mu di hati kami,","yang memberkati setiap sharing dan pergumulan yang kami ungkapkan dalam pertemuan ini,","yang setia mendampingi Gereja-Mu yang berziarah dari pertemuan ke pertemuan,","yang menjadikan perjumpaan kami sebagai tanda kehadiran Kerajaan-Mu,"],buka_rapat:["yang menganugerahkan akal budi dan kebijaksanaan untuk menimbang dengan jernih,","yang memanggil kami menjadi penatalayan yang setia atas karya pelayanan Gereja-Mu,","yang dengan Roh Kudus-Mu menerangi musyawarah agar selaras dengan kehendak-Mu,","yang menghendaki segala sesuatu diatur dengan baik dan demi kemuliaan-Mu,"],tutup_rapat:["yang telah membimbing jalannya musyawarah dan pertimbangan hati kami,","yang mengikat keputusan kami dalam kasih, bukan dalam kepentingan diri sendiri,","yang setia menyertai Gereja-Mu dalam setiap pengambilan keputusan,","yang menghendaki damai dan kesatuan sebagai buah dari setiap rapat kami,"],buka_koor:["yang menganugerahkan talenta suara untuk memuji dan memuliakan nama-Mu yang kudus,","yang bersemayam di atas puji-pujian umat-Mu dan berkenan atas nyanyian yang tulus,","yang dengan kidung para malaikat mengajak kami turut bernyanyi bagi kemuliaan-Mu,","yang menjadikan nyanyian kami sebagai doa yang naik harum ke hadirat-Mu,"],tutup_koor:["yang telah memberkati latihan kami dan menyempurnakan yang masih kurang pada diri kami,","yang menerima persembahan suara kami yang sederhana namun tulus,","yang telah mempersatukan suara kami dalam harmoni kasih persaudaraan,","yang berkenan atas puji-pujian yang kami latihkan untuk liturgi kudus-Mu,"],ulang_tahun:["sumber segala kehidupan, yang dengan kasih setia menganugerahkan napas, waktu, dan bertambahnya tahun kepada kami,","yang menenun hidup kami sejak dalam kandungan dan menuntun kami dengan rencana kasih-Mu,","yang dengan murah hati melipatgandakan tahun-tahun kami dan menghiasi dengan berkat-Mu,","yang adalah Alfa dan Omega, awal dan akhir segala usia dan harapan kami,"],kesembuhan:["Allah Tabib Agung yang penuh belas kasih, yang memandang penderitaan kami dan berkuasa menyembuhkan,","yang menjamah yang sakit dengan tangan-Mu yang penuh kuasa dan mengangkat beban penderitaan,","yang tak memandang hina seruan orang yang remuk hatinya dan mendekat kepada yang terluka,","yang dengan bilur-bilur Putra-Mu telah menyembuhkan luka-luka kami,"],keluarga:["Allah Bapa, asal dan teladan setiap keluarga di surga dan di bumi,","yang mempersatukan kami dalam ikatan kasih dan menjadikan rumah kami Gereja kecil-Mu,","yang mengajarkan kesetiaan melalui keluarga Kudus Nazaret,","yang dengan kasih-Mu memelihara setiap rumah tangga dalam damai dan pengampunan,"],pekerjaan:["Bapa yang berkarya tanpa henti dan mengundang kami ambil bagian dalam karya penciptaan-Mu,","yang memberkati kerja tangan kami agar menjadi berkat bagi sesama dan kemuliaan nama-Mu,","yang mempercayakan talenta kepada kami untuk dikembangkan dengan setia,","yang melihat ketulusan usaha kami bahkan saat lelah dan tak terlihat manusia,"],perjalanan:["Allah yang menyertai umat-Mu dalam setiap perjalanan, dari Mesir menuju tanah terjanji,","yang menjadi penuntun di padang gurun dan bintang terang di kala malam,","yang menjaga langkah kaki kami agar tak goyah dan memelihara dari segala marabahaya,","yang hadir sebagai sahabat seperjalanan yang tak pernah meninggalkan,"],bimbingan:["Allah sumber kebijaksanaan, yang membimbing langkah kami saat kami tidak tahu jalan,","yang menerangi kegelapan keraguan kami dengan terang Roh Kudus-Mu,","yang berbisik lembut dalam hati nurani dan mengarahkan kami kepada kebenaran-Mu,","yang tak membiarkan domba-domba-Mu tersesat tanpa tuntunan Gembala yang baik,"],arwah:["Allah Bapa sumber kehidupan abadi, yang mengalahkan maut melalui kebangkitan Putra-Mu,","yang memanggil setiap jiwa kembali kepada-Mu dengan kasih yang tak berkesudahan,","yang menghapus air mata duka dan menjanjikan kebangkitan mulia bagi yang percaya,","yang membuka pintu kerahiman-Mu bagi mereka yang beristirahat dalam damai,"],syukur:["Allah Bapa yang murah hati, yang melimpahkan berkat-Mu tanpa henti dalam hidup kami,","yang dengan tangan terbuka mencurahkan kebaikan bahkan sebelum kami meminta,","yang mengubah ratapan kami menjadi tarian dan mengisi bejana hidup kami hingga melimpah,","yang dalam suka maupun duka tetap setia memelihara kami dengan kasih,"],tobat:["Allah Bapa yang Maharahim, yang tak pernah lelah mengampuni dan merangkul kami kembali,","yang menanti kepulangan kami seperti Bapa menanti anak yang hilang,","yang dengan darah Putra-Mu telah menghapus hutang dosa kami,","yang dengan lembut membasuh hati kami dan membaharui semangat yang luluh,"]},qc={makan:{text:"Segala ciptaan Allah itu baik dan tidak ada yang haram, jika diterima dengan ucapan syukur, sebab semuanya itu dikuduskan oleh firman Allah dan doa.",ref:"1 Tim 4:4-5",full:"Segala ciptaan Allah itu baik... dikuduskan oleh firman Allah dan doa. (1 Tim 4:4-5)"},pagi:{text:"Tak berkesudahan kasih setia TUHAN, tak habis-habisnya rahmat-Nya, selalu baru tiap pagi.",ref:"Rat 3:22-23",full:"Tak berkesudahan kasih setia TUHAN, tak habis-habisnya rahmat-Nya, selalu baru tiap pagi. (Rat 3:22-23)"},malam:{text:"Dengan tenteram aku mau membaringkan diri, lalu segera tidur, sebab hanya Engkaulah, ya TUHAN, yang membuat aku diam dengan aman.",ref:"Mzm 4:9",full:"Dengan tenteram aku mau membaringkan diri, lalu segera tidur, sebab hanya Engkaulah, ya TUHAN, yang membuat aku diam dengan aman. (Mzm 4:9)"},buka_pertemuan:{text:"Di mana dua atau tiga orang berkumpul dalam nama-Ku, di situ Aku ada di tengah-tengah mereka.",ref:"Mat 18:20",full:"Di mana dua atau tiga orang berkumpul dalam nama-Ku, di situ Aku ada di tengah-tengah mereka. (Mat 18:20)"},tutup_pertemuan:{text:"Dan segala sesuatu yang kamu lakukan dengan perkataan atau perbuatan, lakukanlah semuanya itu dalam nama Tuhan Yesus, sambil mengucap syukur kepada Allah Bapa oleh Dia.",ref:"Kol 3:17",full:"Dan segala sesuatu yang kamu lakukan dengan perkataan atau perbuatan, lakukanlah semuanya itu dalam nama Tuhan Yesus, sambil mengucap syukur oleh Dia kepada Allah Bapa. (Kol 3:17)"},buka_rapat:{text:"Rancangan gagal kalau tidak ada pertimbangan, tetapi terlaksana kalau penasihat banyak.",ref:"Ams 15:22",full:"Rancangan gagal kalau tidak ada pertimbangan, tetapi terlaksana kalau penasihat banyak. (Ams 15:22)"},tutup_rapat:{text:"TUHAN memberkati engkau dan melindungi engkau; TUHAN menyinari engkau dengan wajah-Nya dan memberi engkau kasih karunia; TUHAN menghadapkan wajah-Nya kepadamu dan memberi engkau damai sejahtera.",ref:"Bil 6:24-26",full:"TUHAN memberkati engkau dan melindungi engkau; TUHAN menyinari engkau dengan wajah-Nya dan memberi engkau kasih karunia; TUHAN menghadapkan wajah-Nya kepadamu dan memberi engkau damai sejahtera. (Bil 6:24-26)"},buka_koor:{text:"Marilah kita bersorak-sorai untuk TUHAN, bersorak-sorak bagi gunung batu keselamatan kita. Biarlah kita menghadap wajah-Nya dengan nyanyian syukur.",ref:"Mzm 95:1-2",full:"Marilah kita bersorak-sorai untuk TUHAN, bersorak-sorak bagi gunung batu keselamatan kita. Biarlah kita menghadap wajah-Nya dengan nyanyian syukur. (Mzm 95:1-2)"},tutup_koor:{text:"Hendaklah perkataan Kristus diam dengan segala kekayaannya di antara kamu, sambil mengajar dan menegur seorang akan yang lain dengan segala hikmat dan sambil menyanyikan mazmur, dan puji-pujian dan nyanyian rohani.",ref:"Kol 3:16",full:"Hendaklah perkataan Kristus diam dengan segala kekayaannya di antara kamu, sambil menyanyikan mazmur, dan puji-pujian dan nyanyian rohani, kamu mengucap syukur kepada Allah di dalam hatimu. (Kol 3:16)"},ulang_tahun:{text:"Ajarlah kami menghitung hari-hari kami sedemikian, hingga kami beroleh hati yang bijaksana.",ref:"Mzm 90:12",full:"Ajarlah kami menghitung hari-hari kami sedemikian, hingga kami beroleh hati yang bijaksana. (Mzm 90:12)"},kesembuhan:{text:"Sebab Aku akan mendatangkan kesembuhan bagimu, Aku akan mengobati luka-lukamu, demikianlah firman TUHAN.",ref:"Yer 30:17",full:"Sebab Aku akan mendatangkan kesembuhan bagimu, Aku akan mengobati luka-lukamu. (Yer 30:17)"},keluarga:{text:"Tetapi aku dan seisi rumahku, kami akan beribadah kepada TUHAN.",ref:"Yos 24:15",full:"Tetapi aku dan seisi rumahku, kami akan beribadah kepada TUHAN. (Yos 24:15)"},pekerjaan:{text:"Apa pun juga yang kamu perbuat, perbuatlah dengan segenap hatimu seperti untuk Tuhan dan bukan untuk manusia.",ref:"Kol 3:23",full:"Apa pun juga yang kamu perbuat, perbuatlah dengan segenap hatimu seperti untuk Tuhan. (Kol 3:23)"},perjalanan:{text:"TUHAN akan menjaga keluar masukmu, dari sekarang sampai selama-lamanya.",ref:"Mzm 121:8",full:"TUHAN akan menjaga keluar masukmu, dari sekarang sampai selama-lamanya. (Mzm 121:8)"},bimbingan:{text:"Percayalah kepada TUHAN dengan segenap hatimu, dan janganlah bersandar kepada pengertianmu sendiri. Maka Ia akan meluruskan jalanmu.",ref:"Ams 3:5-6",full:"Percayalah kepada TUHAN dengan segenap hatimu... maka Ia akan meluruskan jalanmu. (Ams 3:5-6)"},arwah:{text:"Akulah kebangkitan dan hidup; barangsiapa percaya kepada-Ku, ia akan hidup walaupun ia sudah mati.",ref:"Yoh 11:25",full:"Akulah kebangkitan dan hidup; barangsiapa percaya kepada-Ku, ia akan hidup walaupun ia sudah mati. (Yoh 11:25)"},syukur:{text:"Bersyukurlah kepada TUHAN, sebab Ia baik! Bahwasanya untuk selama-lamanya kasih setia-Nya.",ref:"Mzm 107:1",full:"Bersyukurlah kepada TUHAN, sebab Ia baik! Bahwasanya untuk selama-lamanya kasih setia-Nya. (Mzm 107:1)"},tobat:{text:"Sekalipun dosamu merah seperti kirmizi, akan menjadi putih seperti salju.",ref:"Yes 1:18",full:"Sekalipun dosamu merah seperti kirmizi, akan menjadi putih seperti salju. (Yes 1:18)"}},bc={makan:["sehingga kami dikuatkan untuk berbagi rezeki dengan sesama yang berkekurangan dan senantiasa bersyukur atas kemurahan-Mu","sehingga santapan ini menguatkan tubuh dan jiwa kami untuk semakin setia melayani Dikau dan sesama","sehingga kami semakin peka akan kelaparan sesama dan murah hati membagikan berkat-Mu","sehingga melalui rezeki ini kami memuliakan Dikau dan bertumbuh dalam kasih persaudaraan"],pagi:["sehingga hari ini menjadi persembahan yang hidup bagi kemuliaan-Mu dan kebaikan bagi sesama yang kami jumpai","sehingga setiap langkah hari ini memancarkan kasih-Mu dan membawa damai bagi yang letih","sehingga kami tekun dalam kebaikan dan tak jemu menjadi saksi terang-Mu di dunia","sehingga suka dan duka hari ini kami jalani bersama Dikau dengan hati yang tabah"],malam:["sehingga kami beristirahat dalam damai-Mu, dijauhkan dari mimpi buruk dan bangun dengan semangat baru untuk mengasihi","sehingga malam ini menjadi pelukan kasih-Mu yang memulihkan jiwa dan menyembuhkan penat","sehingga dalam tidur pun kami tetap berada dalam penjagaan malaikat-Mu","sehingga esok kami bangun dengan hati baru, siap melakukan kehendak-Mu"],buka_pertemuan:["sehingga pertemuan ini berbuah pengertian yang mendalam, saling mendengarkan dengan rendah hati, dan keputusan yang bijaksana seturut kehendak-Mu","sehingga setiap peserta pulang dengan hati yang tercerahkan, semakin mengasihi, dan siap melaksanakan buah permenungan bersama","sehingga diskusi kami dijauhkan dari perdebatan yang sia-sia, melainkan dipenuhi Roh hikmat dan kasih persaudaraan","sehingga perjumpaan ini menjadi tanda kehadiran-Mu yang menyatukan dan menguatkan langkah pelayanan kami"],tutup_pertemuan:["sehingga buah pertemuan ini kami bawa pulang, kami hidupi dalam keluarga, dan menjadi berkat bagi lingkungan kami","sehingga apa yang telah kami dengarkan tidak berhenti sebagai wacana, melainkan berbuah dalam tindakan kasih yang nyata","sehingga kebersamaan ini menguatkan iman kami dan mendorong kami setia berjalan bersama sebagai Gereja yang sinodal","sehingga kami pulang dengan selamat, dijauhkan dari bahaya, dan dipertemukan kembali dalam sukacita"],buka_rapat:["sehingga rapat ini berjalan dengan lancar, tertib, bijaksana, dijauhkan dari konflik kepentingan, dan semata demi kemuliaan nama-Mu","sehingga setiap pertimbangan kami diterangi Roh Kudus-Mu, menghasilkan keputusan yang adil, berani, dan bertanggung jawab","sehingga kami mampu mendengarkan satu sama lain dengan lapang dada dan mengutamakan kebaikan bersama umat-Mu","sehingga karya pelayanan yang kami rencanakan sungguh berbuah dan memuliakan Dikau"],tutup_rapat:["sehingga keputusan yang telah kami ambil dilaksanakan dengan setia, penuh tanggung jawab, dan membawa damai bagi umat-Mu","sehingga kami pulang dengan hati yang lega, saling mengampuni kekurangan selama musyawarah, dan tetap satu dalam kasih","sehingga apa yang kami sepakati menjadi berkat, bukan beban, dan mengantar Gereja-Mu bertumbuh dalam persatuan","sehingga karya kami selanjutnya Kau sertai hingga selesai dengan baik demi kemuliaan-Mu"],buka_koor:["sehingga latihan ini berjalan lancar, suara kami selaras, hati kami seirama, dan seluruhnya menjadi persembahan yang memuliakan nama-Mu","sehingga talenta yang Kaupercayakan kepada kami berkembang, kami semakin tekun berlatih, dan rendah hati dalam melayani","sehingga melalui nyanyian kami, umat-Mu terbantu untuk berdoa dengan lebih khusyuk dan menghayati liturgi kudus-Mu","sehingga dirigen, organis, dan seluruh petugas koor Kau bimbing dengan kesabaran dan sukacita pelayanan"],tutup_koor:["sehingga apa yang telah kami latihkan menjadi persembahan yang harum dan berkenan di hadirat-Mu pada perayaan liturgi nanti","sehingga kami Kau hantarkan pulang dengan selamat, dijauhkan dari kelelahan yang memadamkan semangat, dan dibangunkan dengan sukacita baru","sehingga kekurangan dan kesalahan selama latihan Kau sempurnakan, dan Kau ubah menjadi keindahan harmoni kasih-Mu","sehingga semangat untuk melayani melalui nyanyian tetap menyala, dan kami semakin setia sebagai pemazmur Gereja-Mu"],ulang_tahun:["sehingga tahun-tahun yang Engkau anugerahkan menjadi berkat, membawa kebijaksanaan, sukacita, dan kesetiaan yang semakin mendalam pada kehendak-Mu","sehingga ia semakin serupa dengan Putra-Mu dalam kasih, rendah hati, dan murah hati","sehingga usianya menjadi kidung syukur yang tak henti memuliakan nama-Mu","sehingga ia Kau tuntun menuju kepenuhan hidup yang Kausingkapkan dalam Kristus"],kesembuhan:["sehingga ia dipulihkan sepenuhnya, merasakan jamahan kasih-Mu yang menyembuhkan, dan bangkit untuk kembali memuji nama-Mu dengan penuh syukur","sehingga sakitnya Kau ubah menjadi jalan kekudusan dan kesaksian akan kuasa-Mu","sehingga ia Kau angkat dari kelemahan dan Kau beri kekuatan baru bagaikan rajawali","sehingga melalui pemulihan ini, imannya semakin teguh dan hatinya semakin bersyukur"],keluarga:["sehingga keluarga kami semakin bertumbuh dalam kesetiaan, pengampunan, dan menjadi saksi kasih-Mu yang hidup di tengah dunia","sehingga rumah kami menjadi tempat Sabda-Mu didengarkan dan dilakukan dengan sukacita","sehingga kasih, sabar, dan setia berakar kuat di tengah kami seperti keluarga Nazaret","sehingga kami saling menopang dalam suka duka dan setia hingga akhir"],pekerjaan:["sehingga setiap tugas yang kami lakukan menjadi jalan kekudusan, berbuah baik bagi banyak orang, dan memuliakan nama-Mu","sehingga karya kami Kau kuduskan dan Kau jadikan saluran berkat bagi sesama","sehingga kami bekerja bukan untuk dipuji manusia, melainkan demi kemuliaan-Mu semata","sehingga lelah kami Kau ubah menjadi sukacita karena ambil bagian dalam karya penciptaan-Mu"],perjalanan:["sehingga perjalanan ini selamat, berbuah perjumpaan yang baik, dan membawa kami kembali dengan hati penuh syukur","sehingga setiap persinggahan menjadi kesempatan mewartakan damai-Mu","sehingga kami tiba di tujuan dengan selamat dan dijauhkan dari segala celaka","sehingga langkah kami Kau tuntun dan pulang kami Kau sambut dengan sukacita"],bimbingan:["sehingga kami berani melangkah dalam terang-Mu, memilih yang benar di tengah keraguan, dan s
